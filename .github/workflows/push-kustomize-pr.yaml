---
name: Push PR Kustomize OCI
on:
  pull_request:
    branches:
      - main
    # Only run when something kustomize-relevant changes. Avoids spurious
    # failures on PRs that don't touch KCL — and lets this workflow stay
    # dormant until issue #8 adds the kcl/ directory and the deploy profile.
    paths:
      - 'kcl/**'
      - 'tests/kcl-*.yaml'
      - '.github/workflows/push-kustomize-pr.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  push-kustomize:
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-push-kustomize.yaml@main
    with:
      runs-on: ubuntu-latest
      kcl-source-dir: kcl
      kcl-profile-file: tests/kcl-deploy-profile.yaml
      kustomize-oci-repo: ghcr.io/stuttgart-things/homerun2-notification-catcher-kustomize
      tag: pr-${{ github.event.number }}-${{ github.event.pull_request.head.sha }}
    secrets: inherit # pragma: allowlist secret
