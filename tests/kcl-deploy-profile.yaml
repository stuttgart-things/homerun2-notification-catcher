# homerun2-notification-catcher KCL deploy profile.
#
# Values consumed by kcl/labels.k via option("config.*"). The Dagger
# render-kustomize-base task renders kcl/ against this profile and publishes
# the result as the kustomize OCI base.
#
# outputSecrets values are Flux substitution tokens (${TEAMS_WEBHOOK_URL})
# so Flux's substituteFrom rewrites them at apply time using values from
# the cluster's homerun2-secrets Secret.
#
# The routing config (/etc/notification-catcher/config.yaml) is NOT shipped
# by the chart — the Deployment mounts a ConfigMap named
# `<name>-notify` that the caller (cluster overlay) must provide.
# See docs/deployment.md and notify.example.yaml.

config.image: ghcr.io/stuttgart-things/homerun2-notification-catcher:latest
config.namespace: homerun2

config.redisAddr: redis-stack.homerun2.svc.cluster.local
config.redisPort: "6379"
config.redisStream: alerts
config.consumerGroup: homerun2-notification-catcher
config.redisPassword: "${REDIS_PASSWORD}"

config.logFormat: json
config.logLevel: info

# Flux substitutes ${TEAMS_WEBHOOK_URL} at apply time. The resulting Secret
# is envFrom'd by the Deployment so the catcher sees a real URL on stdin env.
config.outputSecrets:
  TEAMS_WEBHOOK_URL: "${TEAMS_WEBHOOK_URL}"

# Routing config is caller-supplied — see docs/deployment.md.
config.notifyConfig: ""
